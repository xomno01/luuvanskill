<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="Claude Code CLI install">
<defs>
  <radialGradient id="cbg" cx="50%" cy="35%" r="72%"><stop offset="0" stop-color="#0d1535"/><stop offset="1" stop-color="#05080e"/></radialGradient>
  <linearGradient id="cbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="0.5" stop-color="#21e6ff"/><stop offset="1" stop-color="#00D4AA"/></linearGradient>
  <filter id="cglow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="cshine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<!-- Background -->
<rect width="860" height="220" rx="12" fill="url(#cbg)" stroke="#1e2d5a"/>

<!-- Title bar -->
<rect width="860" height="34" rx="12" fill="#0a1122"/>
<rect y="12" width="860" height="22" fill="#0a1122"/>
<circle cx="20" cy="17" r="5" fill="#ff5f56"/>
<circle cx="38" cy="17" r="5" fill="#febc2e"/>
<circle cx="56" cy="17" r="5" fill="#28c840"/>
<text x="70" y="22" font-size="11.5" fill="#4a5980">~/.claude — Claude Code CLI Setup</text>

<!-- Animated sparkle dots -->
<g fill="#7C5CFF">
  <circle cx="800" cy="60" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.3s" begin="0s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="90" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="840" cy="70" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="70" r="1"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="130" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
</g>
<g fill="#21e6ff">
  <circle cx="810" cy="150" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="25" cy="170" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.9s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="845" cy="190" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Section: Claude Code heading -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  <text x="40" y="62" font-size="13" fill="#7C5CFF" filter="url(#cglow)" font-weight="bold">◆ CLAUDE CODE CLI</text>
  <text x="200" y="62" font-size="11" fill="#3a4a70">— cài skill + agent tự động</text>
</g>

<!-- Step 1: Plugin install -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
  <text x="40" y="84" font-size="12" fill="#4a6090">Cách 1 — Plugin (gọn nhất)</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
  <text x="40" y="103" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="103" font-size="12" fill="#aac0e8">/plugin marketplace add </text>
  <text x="222" y="103" font-size="12" fill="#ffae3d">xomno01/luuvanskill</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
  <text x="40" y="120" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="120" font-size="12" fill="#aac0e8">/plugin install </text>
  <text x="166" y="120" font-size="12" fill="#ffae3d">luuvanskill</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
  <text x="40" y="137" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="137" font-size="12" fill="#aac0e8">/reload-plugins</text>
  <!-- blinking cursor -->
  <rect x="178" y="125" width="7" height="13" fill="#21e6ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="2.2s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Step 2: Manual install -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
  <text x="40" y="158" font-size="12" fill="#4a6090">Cách 2 — Copy thủ công (tên ngắn /ecc)</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
  <text x="40" y="176" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="176" font-size="12" fill="#aac0e8">git clone https://github.com/xomno01/luuvanskill.git</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.2s" fill="freeze"/>
  <text x="40" y="193" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="193" font-size="12" fill="#aac0e8">cp -r luuvanskill/skills/* </text>
  <text x="222" y="193" font-size="12" fill="#21e6ff">~/.claude/skills/</text>
  <text x="336" y="193" font-size="12" fill="#808ca0">&amp;&amp; cp -r luuvanskill/agents/* </text>
  <text x="510" y="193" font-size="12" fill="#21e6ff">~/.claude/agents/</text>
</g>

<!-- Auto-invoke tip -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.7s" fill="freeze"/>
  <rect x="38" y="203" width="784" height="1" fill="#1a2d55"/>
  <text x="40" y="216" font-size="11" fill="#5c7aa8">💡 Auto-invoke: Claude đọc </text>
  <text x="175" y="216" font-size="11" fill="#7C5CFF" font-style="italic">description</text>
  <text x="231" y="216" font-size="11" fill="#5c7aa8"> của skill/agent → tự spawn đúng vai, không cần gõ / hay @</text>
</g>

<!-- Progress bar at bottom -->
<rect x="38" y="208" width="0" height="2" rx="1" fill="url(#cbar)">
  <animate attributeName="width" values="0;784" dur="3.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
</rect>
</svg>
