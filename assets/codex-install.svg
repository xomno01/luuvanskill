<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" font-family="ui-monospace,Menlo,Consolas,monospace" role="img" aria-label="Codex CLI install">
<defs>
  <radialGradient id="xbg" cx="50%" cy="35%" r="72%"><stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#060a14"/></radialGradient>
  <linearGradient id="xbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4D8D"/><stop offset="0.5" stop-color="#ffae3d"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  <filter id="xglow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="xshine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<!-- Background -->
<rect width="860" height="240" rx="12" fill="url(#xbg)" stroke="#2a1a40"/>

<!-- Title bar -->
<rect width="860" height="34" rx="12" fill="#0c1020"/>
<rect y="12" width="860" height="22" fill="#0c1020"/>
<circle cx="20" cy="17" r="5" fill="#ff5f56"/>
<circle cx="38" cy="17" r="5" fill="#febc2e"/>
<circle cx="56" cy="17" r="5" fill="#28c840"/>
<text x="70" y="22" font-size="11.5" fill="#4a3a60">~/.agents/skills — Codex CLI Setup</text>

<!-- Animated sparkle dots -->
<g fill="#FF4D8D">
  <circle cx="800" cy="60" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.3s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="110" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="845" cy="80" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="25" cy="80" r="1"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="40" cy="155" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
</g>
<g fill="#ffae3d">
  <circle cx="815" cy="170" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="28" cy="200" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.9s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="848" cy="210" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></circle>
</g>

<!-- Section heading -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>
  <text x="40" y="62" font-size="13" fill="#FF4D8D" filter="url(#xglow)" font-weight="bold">◆ OPENAI CODEX CLI</text>
  <text x="205" y="62" font-size="11" fill="#3a3060">— install.sh + codex-isolated.bat</text>
</g>

<!-- Step 1: Clone + install.sh -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
  <text x="40" y="84" font-size="12" fill="#5a4080">Bước 1 — Cài 13 skills (1 lệnh)</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
  <text x="40" y="103" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="103" font-size="12" fill="#c8b0e8">git clone https://github.com/xomno01/luuvanskill.git</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
  <text x="40" y="120" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="120" font-size="12" fill="#c8b0e8">bash luuvanskill/codex/install.sh</text>
</g>

<!-- Output lines -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>
  <text x="56" y="136" font-size="11" fill="#3a8a5a">[OK] ~/.codex/AGENTS.md</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.3s" fill="freeze"/>
  <text x="56" y="150" font-size="11" fill="#3a8a5a">[OK] ~/.agents/skills/ecc/SKILL.md  [OK] ~/.agents/skills/senior-dev  ...</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
  <text x="56" y="164" font-size="11" fill="#ffae3d">Done! 13 skills installed. Invoke with: $skill-name</text>
</g>

<!-- Step 2: Parallel bug + isolated -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.0s" fill="freeze"/>
  <text x="40" y="183" font-size="12" fill="#5a4080">Bước 2 — Mở nhiều project cùng lúc (không conflict)</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.4s" fill="freeze"/>
  <text x="40" y="200" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="200" font-size="12" fill="#c8b0e8">codex-isolated.bat</text>
  <text x="190" y="200" font-size="12" fill="#6a5090">  ← mỗi project 1 CODEX_HOME riêng, không leak state</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
  <text x="40" y="217" font-size="12" fill="#21b55e">▸</text>
  <text x="56" y="217" font-size="12" fill="#c8b0e8">$ecc</text>
  <text x="90" y="217" font-size="12" fill="#6a5090">  | </text>
  <text x="108" y="217" font-size="12" fill="#c8b0e8">$senior-dev</text>
  <text x="208" y="217" font-size="12" fill="#6a5090">  | </text>
  <text x="226" y="217" font-size="12" fill="#c8b0e8">$debugger</text>
  <text x="316" y="217" font-size="12" fill="#6a5090">  ← auto-invoke, không cần gõ</text>
  <!-- blinking cursor -->
  <rect x="327" y="205" width="7" height="13" fill="#FF4D8D">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.2s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Progress bar -->
<rect x="38" y="228" width="0" height="2" rx="1" fill="url(#xbar)">
  <animate attributeName="width" values="0;784" dur="4.0s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
</rect>
</svg>
